<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetConsole</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#6b7686;--bd:#dde1e8;--acc:#2563eb;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171d2b;--fg:#e6e9ef;--mut:#93a0b4;--bd:#2a3347;--acc:#60a5fa;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:16px;margin:0}nav{display:flex;gap:4px;flex-wrap:wrap}
button,input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.danger{color:var(--bad)}
main{padding:16px;max-width:1300px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}.card b{display:block;font-size:24px}.mut{color:var(--mut)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px}table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600}
.st-online{color:var(--ok)}.st-offline{color:var(--bad)}.st-alerting{color:var(--warn)}
form.f{display:grid;gap:8px;max-width:520px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:16px}
label{display:grid;gap:2px}small{color:var(--mut)}#login{max-width:360px;margin:15vh auto;display:grid;gap:8px}
</style>
</head>
<body>
<div id="login" hidden>
  <h1>NetConsole</h1>
  <input id="tok" type="password" placeholder="Token de acesso" autocomplete="current-password">
  <button class="pri" id="go">Entrar</button><small id="lerr"></small>
</div>
<div id="app" hidden>
<header><h1>NetConsole</h1><nav id="nav"></nav><span style="flex:1"></span><span class="mut" id="who"></span><button id="out">Sair</button></header>
<main id="view"></main>
</div>
<script>
// Todo dado vindo dos vendors é não-confiável: só textContent, nunca innerHTML.
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const n=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')n.className=v;else if(x.startsWith('on'))n.addEventListener(x.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(x,v===true?'':v)}for(const c of k.flat())if(c!=null)n.append(c.nodeType?c:document.createTextNode(c));return n};
let token=sessionStorage.getItem('nc_token')||'',role='',tab='dash',vendors=[];
async function api(path,opt={}){
  const r=await fetch('/api'+path,{...opt,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:opt.body&&JSON.stringify(opt.body)});
  if(r.status===401){logout();throw new Error('sessão expirada')}
  if(r.status===204)return null;
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));
  return j;
}
function logout(){sessionStorage.removeItem('nc_token');token='';start()}
async function start(){
  $('#app').hidden=$('#login').hidden=true;
  if(!token){$('#login').hidden=false;return}
  try{role=(await api('/me')).role;vendors=await api('/vendors')}catch(e){$('#login').hidden=false;$('#lerr').textContent=e.message;return}
  $('#app').hidden=false;$('#who').textContent=role;
  const tabs=[['dash','Resumo'],['dev','Dispositivos'],['cli','Clientes'],['prov','Provedores']];
  if(role==='admin')tabs.push(['aud','Auditoria']);
  $('#nav').replaceChildren(...tabs.map(([k,l])=>el('button',{class:k===tab?'on':'',onclick:()=>{tab=k;start()}},l)));
  render();
}
$('#go').onclick=()=>{token=$('#tok').value.trim();sessionStorage.setItem('nc_token',token);start()};
$('#out').onclick=logout;
const when=t=>t?new Date(t*1000).toLocaleString('pt-BR'):'—';
function table(cols,rows){return el('div',{class:'tw'},el('table',{},el('thead',{},el('tr',{},cols.map(c=>el('th',{},c)))),el('tbody',{},rows.map(r=>el('tr',{},r.map(c=>el('td',{},c)))))))}
const status=s=>el('span',{class:'st-'+s},'● '+s);
async function render(){
  const v=$('#view');v.replaceChildren(el('p',{class:'mut'},'Carregando…'));
  try{({dash,dev,cli,prov,aud}[tab])(v)}catch(e){v.replaceChildren(el('p',{},e.message))}
}
async function dash(v){
  const s=await api('/summary');
  v.replaceChildren(el('div',{class:'cards'},
    [['Dispositivos',s.devices],['Online',s.online],['Offline',s.offline],['Clientes',s.clients]].map(([l,n])=>el('div',{class:'card'},el('span',{class:'mut'},l),el('b',{},n)))),
    table(['Vendor','Total','Online','Offline','Alerting'],Object.entries(s.by_vendor).map(([k,x])=>[k,x.total,x.online,x.offline,x.alerting])));
}
async function dev(v){
  const q=el('input',{placeholder:'Buscar nome, MAC, IP, serial, site…'}),ty=el('select',{},['','ap','switch','gateway'].map(x=>el('option',{value:x},x||'todos tipos'))),
        st=el('select',{},['','online','offline','alerting'].map(x=>el('option',{value:x},x||'todos status')));
  const box=el('div');
  const load=async()=>{
    const p=new URLSearchParams();if(q.value)p.set('q',q.value);if(ty.value)p.set('type',ty.value);if(st.value)p.set('status',st.value);
    const d=await api('/devices?'+p);
    box.replaceChildren(table(['Status','Nome','Tipo','Vendor','Modelo','IP','MAC','Site',''],d.map(x=>[status(x.status),x.name,x.type,x.vendor,x.model,x.ip,x.mac,x.site,
      role==='admin'?el('button',{class:'danger',onclick:async()=>{if(!confirm('Reiniciar '+x.name+'?'))return;try{await api(`/devices/${x.provider_id}/${encodeURIComponent(x.id)}/reboot`,{method:'POST'});alert('Reboot enviado')}catch(e){alert(e.message)}}},'Reboot'):'']))
      ,el('p',{class:'mut'},d.length+' itens'));
  };
  [q,ty,st].forEach(x=>x.addEventListener(x===q?'input':'change',load));
  v.replaceChildren(el('div',{class:'bar'},q,ty,st),box);load();
}
async function cli(v){
  const q=el('input',{placeholder:'Buscar MAC, IP, nome, SSID…'}),box=el('div');
  const load=async()=>{const c=await api('/clients?q='+encodeURIComponent(q.value));
    box.replaceChildren(table(['Nome','MAC','IP','Tipo','SSID','VLAN','Vendor','Conectado em'],c.map(x=>[x.name,x.mac,x.ip,x.kind,x.ssid,x.vlan,x.vendor,x.device_id])))};
  q.addEventListener('input',load);v.replaceChildren(el('div',{class:'bar'},q),box);load();
}
async function prov(v){
  const list=await api('/providers');
  const rows=list.map(p=>[p.name,p.vendor,p.enabled?'ativo':'inativo',when(p.last_sync),p.last_error?el('span',{class:'st-offline'},p.last_error):'ok',
    role==='admin'?el('span',{},el('button',{onclick:async()=>{await api(`/providers/${p.id}/sync`,{method:'POST'});render()}},'Sincronizar'),' ',
      el('button',{class:'danger',onclick:async()=>{if(confirm('Remover '+p.name+'?')){await api('/providers/'+p.id,{method:'DELETE'});render()}}},'Remover')):'']);
  const parts=[table(['Nome','Vendor','Estado','Última coleta','Resultado',''],rows)];
  if(role==='admin')parts.push(el('h3',{},'Adicionar provedor'),form());
  v.replaceChildren(...parts);
}
function form(){
  const vs=el('select',{},vendors.map(x=>el('option',{value:x.vendor},x.label))),name=el('input',{placeholder:'ex.: Meraki - Colégio Norte'}),fl=el('div',{class:'f2',style:'display:grid;gap:8px'}),msg=el('small');
  const draw=()=>{const d=vendors.find(x=>x.vendor===vs.value);fl.replaceChildren(...d.fields.map(f=>el('label',{},f.label+(f.required?' *':''),
    f.kind==='bool'?el('input',{type:'checkbox','data-k':f.name,checked:f.default!==false}):el('input',{'data-k':f.name,type:f.secret?'password':'text',value:f.default||'',autocomplete:'off'}),f.help&&el('small',{},f.help))))};
  const cfg=()=>Object.fromEntries([...fl.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.type==='checkbox'?i.checked:i.value]));
  vs.onchange=draw;draw();
  return el('form',{class:'f',onsubmit:e=>e.preventDefault()},el('label',{},'Vendor',vs),el('label',{},'Nome',name),fl,
    el('div',{class:'bar'},
      el('button',{onclick:async()=>{msg.textContent='Testando…';try{const r=await api('/providers/test',{method:'POST',body:{vendor:vs.value,config:cfg()}});msg.textContent=r.ok?'OK: '+r.info:'Falha: '+r.error}catch(e){msg.textContent=e.message}}},'Testar'),
      el('button',{class:'pri',onclick:async()=>{try{await api('/providers',{method:'POST',body:{vendor:vs.value,name:name.value,config:cfg()}});render()}catch(e){msg.textContent=e.message}}},'Salvar')),msg);
}
async function aud(v){const a=await api('/audit');v.replaceChildren(table(['Quando','Quem','Ação','Alvo','Detalhe'],a.map(x=>[when(x.ts),x.actor,x.action,x.target,x.detail])))}
start();
</script>
</body>
</html>
